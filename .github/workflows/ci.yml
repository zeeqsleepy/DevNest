name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  # Windows is the primary platform. It is listed first and it is never the job
  # that gets disabled when it goes red.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Integration tests
        run: go test -race -count=1 -tags=integration ./tests/...

      - name: Build
        run: go build ./...

      - name: End-to-end tests
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -o dist/devnest ./cmd/devnest
          go test -count=1 -tags=e2e ./tests/...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Measure coverage
        run: go test -count=1 -coverprofile=coverage.out ./internal/...

      # Two floors, because they mean different things. The domain layer is
      # where the rules live and is held to 80% by rules.md R39; the overall
      # number is a smoke detector for everything else.
      #
      # Neither is a goal. A test that asserts nothing raises coverage and
      # catches nothing, and reviewers are expected to notice the difference.
      - name: Enforce the coverage floors
        run: |
          floor() {
            actual="$(go tool cover -func=coverage.out | grep -E "$1" | \
              awk '{ gsub(/%/,"",$NF); covered += $NF; count += 1 } END { if (count) print covered/count; else print 0 }')"
            printf '%s coverage: %.1f%%\n' "$2" "$actual"
            awk -v actual="$actual" -v floor="$3" 'BEGIN { exit (actual < floor) }' || {
              echo "$2 coverage is below the ${3}% floor"
              exit 1
            }
          }
          total="$(go tool cover -func=coverage.out | tail -1 | tr -d '%' | awk '{print $3}')"
          echo "total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { exit (total < 80) }' || {
            echo "total coverage ${total}% is below the 80% floor"
            exit 1
          }
          floor 'internal/core/' 'internal/core' 80

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The version is pinned rather than tracking latest. A linter that gains
      # a rule overnight turns an unrelated pull request red, and the person
      # who has to work that out is never the one who wanted the new rule.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --config tools/golangci.yml ./...

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The working tree is checked rather than a diff, so that a go.sum
      # appearing, disappearing, or changing is all caught the same way.
      - name: Verify the module graph
        run: |
          go mod verify
          go mod tidy
          changed="$(git status --porcelain -- go.mod go.sum)"
          if [ -n "$changed" ]; then
            echo "go mod tidy changed the module graph:"
            echo "$changed"
            git diff -- go.mod
            exit 1
          fi

      # DevNest has one dependency and the rule in rules.md R13 is that adding
      # another is a decision, not an accident. Pinning the whole graph here
      # means a transitive dependency arriving in a minor version bump turns
      # this job red rather than passing unnoticed.
      #
      # Licenses, checked by hand when each entry was added and recorded in
      # docs/architecture.md:
      #   github.com/goccy/go-yaml  MIT
      - name: Verify the dependency allow list
        run: |
          expected="github.com/goccy/go-yaml"
          actual="$(go list -m -f '{{.Path}}' all | tail -n +2 | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "the dependency graph is not the one this project agreed to:"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
